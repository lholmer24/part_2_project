[package]
name = "mimc"
description = "Shared MiMC support for the Part II benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Enables the extended tests: the 16-count constant-file sweep and the
# 8000-vector Rust/Python agreement check.
extended-tests = []

[dependencies]
ark-bls12-381.workspace = true
ark-ff.workspace = true
# Bulletproofs 2.0.0 still uses curve25519-dalek 3.x, while Spartan 0.9.0 uses
# 4.x. Both scalar types need an adapter, so both versions are dependencies.
curve25519-dalek-v3 = { package = "curve25519-dalek", version = "=3.2.0", default-features = false, features = ["u64_backend"] }
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3", default-features = false }
ff14 = { package = "ff", version = "=0.14.0", default-features = false }
pasta_curves.workspace = true
winter-math.workspace = true
