<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMC proof-system profiles</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #6a737d;
    --line: #d8dee4;
    --panel: #f6f8fa;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: #fff;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 2100px; margin: 0 auto; padding: 16px 28px 0; }
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 255, 255, 0.97);
    border-bottom: 1px solid var(--line);
  }
  .controls-inner {
    max-width: 2100px; margin: 0 auto; padding: 12px 0;
    display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field span {
    font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted);
  }
  select {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; min-width: 170px;
  }
  .slider { flex: 1 1 420px; min-width: 260px; }
  .slider input { width: 100%; accent-color: var(--accent); margin: 0; }
  .ticks {
    display: flex; justify-content: space-between; margin-top: 2px;
    font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  }
  .readout {
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; padding-bottom: 2px;
  }
  .readout b { font-size: 15px; }
  main { padding: 20px 0 32px; }
  .panel { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
  .chart-card {
    border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: #fff;
  }
  .chart-card object { display: block; width: 100%; }
  .card {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; background: var(--panel);
  }
  .card h2 {
    font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .trend { display: block; width: 100%; height: auto; }
  @media (max-width: 1100px) {
    .panel { grid-template-columns: 1fr; }
    .page { padding: 10px 16px 0; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="controls">
    <div class="controls-inner">
      <label class="field"><span>System</span><select id="system"></select></label>
      <label class="field"><span>Phase</span><select id="phase"></select></label>
      <div class="slider">
        <label class="field"><span>Rounds</span></label>
        <input id="rounds" type="range" min="0" max="0" step="1" value="0">
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="readout" id="readout"></div>
    </div>
  </div>

  <main>
    <div class="panel">
      <div class="chart-card">
        <object id="chart" type="image/svg+xml" aria-label="Flame graph for the selected profile"></object>
      </div>
      <div class="card">
        <h2>Per-call time</h2>
        <svg class="trend" id="trend" viewBox="0 0 320 150" role="img" aria-label="Per-call time against round count"></svg>
      </div>
    </div>
  </main>
</div>

<script>
const DATA = {"generated":"2026-11-24T15:58:23Z","systems":[]};
const PHASE_ORDER = ["setup", "prove", "verify"];

const systemSel = document.getElementById("system");
const phaseSel = document.getElementById("phase");
const range = document.getElementById("rounds");
const ticks = document.getElementById("ticks");
const readout = document.getElementById("readout");
const chart = document.getElementById("chart");
const chartWrap = chart.parentElement;
const trend = document.getElementById("trend");

let points = [];
let currentPoint = null;

function fmtInt(value) {
  return Number(value).toLocaleString("en-US");
}

function fmtTime(ns) {
  if (!ns) return "unknown";
  if (ns >= 1e9) return (ns / 1e9).toFixed(2) + " s";
  if (ns >= 1e6) return (ns / 1e6).toFixed(1) + " ms";
  if (ns >= 1e3) return (ns / 1e3).toFixed(0) + " µs";
  return ns + " ns";
}

function shortRounds(value) {
  if (value >= 1024) return (value / 1024) + "k";
  return String(value);
}

function systemData() {
  return DATA.systems.find((item) => item.name === systemSel.value);
}

function phaseData() {
  const system = systemData();
  return system ? system.phases.find((item) => item.name === phaseSel.value) : null;
}

function populateSystems() {
  for (const system of DATA.systems) {
    systemSel.add(new Option(system.name + "  (" + system.field + ")", system.name));
  }
}

function populatePhases(preferred) {
  const system = systemData();
  phaseSel.innerHTML = "";
  if (!system) return;
  const ordered = [...system.phases].sort(
    (a, b) => PHASE_ORDER.indexOf(a.name) - PHASE_ORDER.indexOf(b.name)
  );
  for (const phase of ordered) {
    phaseSel.add(new Option(phase.name, phase.name));
  }
  const names = ordered.map((phase) => phase.name);
  if (preferred && names.includes(preferred)) {
    phaseSel.value = preferred;
  } else if (names.includes("prove")) {
    phaseSel.value = "prove";
  }
}

function populateSlider(preferredRounds) {
  const phase = phaseData();
  if (!phase) return;
  points = phase.points;
  range.max = String(Math.max(0, points.length - 1));
  let index = points.findIndex((point) => point.rounds === preferredRounds);
  if (index < 0) {
    index = points.findIndex((point) => point.rounds === 16384);
  }
  if (index < 0) index = points.length - 1;
  range.value = String(index);
  ticks.innerHTML = points.map((point) => "<span>" + shortRounds(point.rounds) + "</span>").join("");
  render();
}

function fitChart(point) {
  const width = chartWrap.clientWidth;
  if (!width) return;
  chart.setAttribute("width", String(width));
  chart.setAttribute("height", String(Math.round((point.height || 360) * width / 2000)));
}

function render() {
  const phase = phaseData();
  if (!phase || !points.length) return;
  const index = Math.min(Number(range.value), points.length - 1);
  const point = points[index];
  currentPoint = point;

  chart.setAttribute("data", point.svg);
  readout.innerHTML =
    "<b>r = " + fmtInt(point.rounds) + "</b> &middot; " +
    fmtTime(point.per_call_ns) + " per call &middot; " +
    fmtInt(point.samples) + " samples";

  fitChart(point);
  renderTrend(phase, index);
  try {
    history.replaceState(
      null, "",
      "#" + systemSel.value + "/" + phaseSel.value + "/" + point.rounds
    );
  } catch (error) {
    // file:// pages may refuse history updates; the selection still works.
  }
}

function svgEl(name, attrs, text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderTrend(phase, index) {
  trend.innerHTML = "";
  const pts = phase.points;
  if (!pts.length) return;

  const W = 320, H = 150, left = 44, right = 10, top = 12, bottom = 24;
  if (pts.length === 1) {
    trend.appendChild(svgEl("circle", {
      cx: W / 2, cy: H / 2, r: 4.5, fill: "#0969da",
    }));
    trend.appendChild(svgEl("text", {
      x: W / 2, y: H / 2 - 14, "text-anchor": "middle",
      "font-size": 10, fill: "#6a737d", "font-family": "ui-monospace, monospace",
    }, "r = " + fmtInt(pts[0].rounds) + " only"));
    return;
  }

  const logs = pts.map((point) => Math.log2(point.rounds));
  const times = pts.map((point) => Math.log10(Math.max(1, point.per_call_ns)));
  let x0 = Math.min(...logs), x1 = Math.max(...logs);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  let y0 = Math.floor(Math.min(...times)), y1 = Math.ceil(Math.max(...times));
  if (y0 === y1) { y0 -= 1; y1 += 1; }

  const px = (k) => left + ((k - x0) / (x1 - x0)) * (W - left - right);
  const py = (t) => top + (1 - (t - y0) / (y1 - y0)) * (H - top - bottom);

  for (let exponent = y0; exponent <= y1; exponent += 1) {
    const y = py(exponent);
    trend.appendChild(svgEl("line", {
      x1: left, x2: W - right, y1: y, y2: y,
      stroke: "#e6e9ec", "stroke-width": 1,
    }));
    trend.appendChild(svgEl("text", {
      x: left - 6, y: y + 3, "text-anchor": "end",
      "font-size": 9, fill: "#6a737d", "font-family": "ui-monospace, monospace",
    }, fmtTime(Math.pow(10, exponent))));
  }

  const ticksX = [0, 4, 8, 12, 15].filter((k) => k >= x0 && k <= x1);
  for (const k of ticksX) {
    const x = px(k);
    trend.appendChild(svgEl("line", {
      x1: x, x2: x, y1: top, y2: H - bottom,
      stroke: "#eef1f3", "stroke-width": 1,
    }));
    trend.appendChild(svgEl("text", {
      x: x, y: H - 8, "text-anchor": "middle",
      "font-size": 9, fill: "#6a737d", "font-family": "ui-monospace, monospace",
    }, shortRounds(Math.pow(2, k))));
  }

  const path = pts.map((point, i) => {
    const command = i === 0 ? "M" : "L";
    return command + px(logs[i]).toFixed(1) + "," + py(times[i]).toFixed(1);
  }).join(" ");
  trend.appendChild(svgEl("path", {
    d: path, fill: "none", stroke: "#0969da", "stroke-width": 1.5,
    "stroke-linejoin": "round", "stroke-linecap": "round",
  }));

  pts.forEach((point, i) => {
    trend.appendChild(svgEl("circle", {
      cx: px(logs[i]), cy: py(times[i]),
      r: i === index ? 4.5 : 2.4,
      fill: i === index ? "#0969da" : "#fff",
      stroke: "#0969da", "stroke-width": 1.4,
    }));
  });
}

function selectFromHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split("/");
  const system = DATA.systems.find((item) => item.name === parts[0]);
  const phase = system && system.phases.find((item) => item.name === parts[1]);
  return {
    system: system ? system.name : DATA.systems[0] && DATA.systems[0].name,
    phase: phase ? phase.name : null,
    rounds: parts[2] ? Number(parts[2]) : 0,
  };
}

systemSel.addEventListener("change", () => {
  const current = points[Number(range.value)];
  populatePhases();
  populateSlider(current ? current.rounds : 0);
});
phaseSel.addEventListener("change", () => {
  const current = points[Number(range.value)];
  populateSlider(current ? current.rounds : 0);
});
range.addEventListener("input", render);
window.addEventListener("resize", () => { if (currentPoint) fitChart(currentPoint); });

const initial = selectFromHash();
populateSystems();
if (initial.system) {
  systemSel.value = initial.system;
  populatePhases(initial.phase);
  populateSlider(initial.rounds);
}
</script>
</body>
</html>
