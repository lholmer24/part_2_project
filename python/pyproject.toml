[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "part2-python"
version = "0.1.0"
description = "Python MiMC reference and benchmark analysis"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["mimc", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
