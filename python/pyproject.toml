[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "part2-python"
version = "0.1.0"
description = "Python MiMC reference and benchmark analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]
analysis = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[tool.setuptools]
packages = ["mimc", "analysis", "profiling"]

[tool.setuptools.package-data]
profiling = ["index_template.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
