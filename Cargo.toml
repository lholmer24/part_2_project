[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Local shared crate used by every proof system.
mimc = { path = "crates/mimc" }

# arkworks 0.6 is the current release line. Exact versions are pinned here and
# transitively by the committed Cargo.lock.
ark-bls12-381 = { version = "=0.6.0", default-features = false, features = ["curve", "std"] }
ark-ff = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["r1cs", "std"] }
ark-relations = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-std = { version = "=0.6.0", default-features = false, features = ["std"] }

# The remaining systems use exact versions and minimal feature sets.
dusk-plonk = { version = "=0.24.0", default-features = false, features = ["alloc"] }
# dusk-plonk's scalar field type. Kept separate so `mimc` can adapt the field
# without depending on the whole prover. Default features include `parallel`,
# so they are disabled here as everywhere else.
dusk-bls12_381 = { version = "=0.16.0", default-features = false }
dusk-bytes = { version = "=0.1.8" }
# dusk-plonk takes `RngCore + CryptoRng` from rand_core 0.6.
rand_core = { version = "=0.6.4", features = ["getrandom"] }
winterfell = { version = "=0.13.1", default-features = false, features = ["std"] }
winter-math = { version = "=0.13.1", default-features = false, features = ["std"] }
halo2_proofs = { version = "=0.4.1", default-features = false, features = ["batch"] }
pasta_curves = { version = "=0.6.1", default-features = false, features = ["alloc"] }
spartan_lib = { package = "spartan", version = "=0.9.0", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154" }

# The R1CS API of bulletproofs is not in a published release. It is on the
# `develop` branch behind the `yoloproofs` feature, so pin an exact commit.
bulletproofs_lib = { package = "bulletproofs", git = "https://github.com/dalek-cryptography/bulletproofs.git", rev = "464acb72432ccc6c5131397fd811a5f01ec2454b", default-features = false, features = ["std", "yoloproofs"] }
